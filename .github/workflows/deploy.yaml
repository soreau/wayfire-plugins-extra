name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ci-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Download
        uses: actions/checkout@v4

      - name: Build website
        run: mkdir ./docs/_site; git clone https://roundabout-host.com/roundabout/wf-docs-generator -b production && cd wf-docs-generator && python ./main.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
